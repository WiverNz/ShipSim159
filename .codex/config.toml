[mcp_servers.mcp-unity]
command = "powershell.exe"
args = [
  "-NoProfile",
  "-Command",
  "node 'Library/PackageCache/com.gamelovers.mcp-unity@382a43a30f4d/Server~/build/index.js'"
]

[mcp_servers.mcp-unity.env]
MCP_UNITY_SETTINGS_PATH = "ProjectSettings/McpUnitySettings.json"
MCP_UNITY_AUTH_TOKEN_PATH = "Library/McpUnity/bridge-token"

[mcp_servers.mcp-unity.tools.recompile_scripts]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.execute_menu_item]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.get_scene_info]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.run_tests]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.get_gameobject]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.get_material_info]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.get_console_logs]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.load_scene]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.save_scene]
approval_mode = "approve"

[mcp_servers.mcp-unity.tools.get_play_mode_status]
approval_mode = "approve"
