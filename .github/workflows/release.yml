name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate release tag and editor version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=$(awk '/^m_EditorVersion:/ {gsub(/\r/, ""); print $2}' ProjectSettings/ProjectVersion.txt)
          [[ "$version" == '6000.6.0f1' ]]

      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.0f1
          targetPlatform: StandaloneWindows64
          buildName: ShipSim159
          buildsPath: build
          versioning: Tag

      - name: Verify and package complete player
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-smoke.sh --pkg-dir build/StandaloneWindows64
          archive="$GITHUB_WORKSPACE/build/ShipSim159-${RELEASE_TAG}-windows-x64.zip"
          (cd build/StandaloneWindows64 && zip -q -r "$archive" .)
          unzip -q "$archive" -d "$RUNNER_TEMP/release-check"
          bash scripts/release-smoke.sh --pkg-dir "$RUNNER_TEMP/release-check"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ShipSim159-${{ github.ref_name }}-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
