name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate release tag and editor version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=$(awk '/^m_EditorVersion:/ {gsub(/\r/, ""); print $2}' ProjectSettings/ProjectVersion.txt)
          [[ "$version" == '6000.6.0f1' ]]
          bundle_version=$(awk '/^[ \t]*bundleVersion:/ {count++; value=$0; sub(/^[ \t]*bundleVersion:[ \t]*/, "", value); sub(/[ \t\r]+$/, "", value)} END {if (count != 1) exit 1; print value}' ProjectSettings/ProjectSettings.asset)
          if [[ "${RELEASE_TAG#v}" != "$bundle_version" ]]; then
            echo "Tag $RELEASE_TAG does not match PlayerSettings.bundleVersion ($bundle_version)" >&2
            exit 1
          fi

      # The builder runs Unity in a container as root, so the workspace comes back owned by
      # root unless it is told which account the runner uses.
      - name: Resolve runner ownership
        id: owner
        run: echo "user=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Restore Unity library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Build Windows player
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.6.0f1
          targetPlatform: StandaloneWindows64
          buildName: ShipSim159
          buildsPath: build
          versioning: None
          chownFilesTo: ${{ steps.owner.outputs.user }}

      - name: Verify and package complete player
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-smoke.sh --pkg-dir build/StandaloneWindows64
          archive="$GITHUB_WORKSPACE/build/ShipSim159-${RELEASE_TAG}-windows-x64.zip"
          (cd build/StandaloneWindows64 && zip -q -r "$archive" .)
          unzip -q "$archive" -d "$RUNNER_TEMP/release-check"
          bash scripts/release-smoke.sh --pkg-dir "$RUNNER_TEMP/release-check"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/ShipSim159-${{ github.ref_name }}-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
